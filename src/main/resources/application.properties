quarkus.http.port=8080
quarkus.datasource.db-kind=h2
quarkus.datasource.username=root
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.format-sql=true
security.jwt.token.secret-key=${JWT_SECRET:secret-key}
security.jwt.token.expire-length=${JWT_EXPIRE_MS:300000}
security.jwt.refresh-token.expire-length=${JWT_REFRESH_EXPIRE_MS:604800000}
quarkus.swagger-ui.always-include=true
